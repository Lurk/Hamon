{%- import "components/common.html" as common -%}

<div class="card">
  <a href="{{-page.pid ~ '.html'-}}">
    <img
      src="{{- get_image_url(src = page.metadata.image, width = 640) | safe -}}"
      srcset="{{- get_image_url(src = page.metadata.image, width = 320) | safe }} 320w, {{- get_image_url(src = page.metadata.image, width = 500) | safe }} 500w, {{- get_image_url(src = page.metadata.image, width = 640) | safe }} 640w, {{- get_image_url(src = page.metadata.image, width = 1000) | safe }} 1000w"
      sizes="(min-width: 1000px) 320px, (min-width: 701px) 31vw, 100vw"
      alt="{{- page.metadata.title -}}"
      loading="lazy"
    />
  </a>
  <div class="card-body">
    <h3>
      {{- common::local_page( path = page.pid ~ '.html', template="post.html",
      text=page.metadata.title, title=page.metadata.title,
      description=page.metadata.preview ) -}}
    </h3>
    <p>{{- page.metadata.preview -}}</p>
  </div>
</div>
